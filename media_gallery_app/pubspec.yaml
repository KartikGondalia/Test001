name: media_gallery_app
description: A Flutter app for managing photos from Google Drive and YouTube videos.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.13.0
  cloud_firestore: ^4.13.0
  google_drive_api: ^0.0.1
  googleapis: ^12.0.0
  google_sign_in: ^6.1.5
  youtube_player_flutter: ^9.0.0
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  http: ^1.1.0
  path_provider: ^2.1.0
  permission_handler: ^11.4.4
  image_picker: ^1.0.4
  provider: ^6.0.0
  google_places_flutter: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
